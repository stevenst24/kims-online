<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIMS - Kemiko Invoice Management System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        .header {
            background: #17365d;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .logout-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .navbar {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            border: none;
            background: #e9eef5;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: #d7e2f0;
        }

        .container {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #17365d;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .button-row {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
        }

        .primary-btn {
            background: #17365d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .secondary-btn {
            background: #777;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .edit-btn {
            background: #e0a800;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
        }

        .search-box {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #17365d;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            padding: 9px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .actions {
            white-space: nowrap;
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f3f8;
        }

        .login-box {
            background: white;
            width: 380px;
            max-width: 90%;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .login-box h1 {
            text-align: center;
            color: #17365d;
        }

        .login-box input {
            margin-bottom: 12px;
        }

        .login-btn {
            width: 100%;
            background: #17365d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
        }

        .message {
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            .header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }
    </style>
</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <h1>KIMS</h1>

        <p style="text-align:center;">
            Kemiko Invoice Management System
        </p>

        <input
            id="loginEmail"
            type="email"
            placeholder="Email"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
        >

        <button
            class="login-btn"
            onclick="loginUser()"
        >
            Login
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>

</div>



<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<div id="appScreen" style="display:none;">


    <header class="header">

        <h1>
            Kemiko Invoice Management System
        </h1>

        <button
            class="logout-btn"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </header>



    <!-- NAVIGATION -->

    <nav class="navbar">

        <button
            class="nav-btn"
            onclick="showPage('representatives')"
        >
            Representatives
        </button>


        <button
            class="nav-btn"
            onclick="showPage('customers')"
        >
            Customers
        </button>


        <button
            class="nav-btn"
            onclick="showPage('products')"
        >
            Products
        </button>

    </nav>



    <main class="container">


        <!-- =================================================
             REPRESENTATIVES
        ================================================== -->

        <section
            id="representatives-page"
            class="page"
        >

            <div class="card">

                <h2>Representatives</h2>

                <div class="form-grid">

                    <input
                        id="repCode"
                        placeholder="Representative Code"
                    >

                    <input
                        id="repName"
                        placeholder="Representative Name"
                    >

                    <input
                        id="territoryCode"
                        placeholder="Territory Code"
                    >

                    <input
                        id="territoryName"
                        placeholder="Territory Name"
                    >

                </div>


                <div class="button-row">

                    <button
                        class="primary-btn"
                        onclick="saveRepresentative()"
                    >
                        Save Representative
                    </button>

                    <button
                        class="secondary-btn"
                        onclick="clearRepresentativeForm()"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <div class="card">

                <input
                    id="representativeSearch"
                    class="search-box"
                    placeholder="Search representatives..."
                    oninput="searchRepresentatives()"
                >


                <table>

                    <thead>

                        <tr>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Territory Code</th>
                            <th>Territory Name</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody
                        id="representativesTableBody"
                    ></tbody>

                </table>

            </div>

        </section>



        <!-- =================================================
             CUSTOMERS
        ================================================== -->

        <section
            id="customers-page"
            class="page"
        >

            <div class="card">

                <h2>Customers</h2>

                <div class="form-grid">

                    <input
                        id="customerCode"
                        placeholder="Customer Code"
                    >

                    <input
                        id="shopName"
                        placeholder="Shop Name"
                    >

                    <input
                        id="address"
                        placeholder="Address"
                    >

                    <input
                        id="ownerName"
                        placeholder="Owner Name"
                    >

                    <input
                        id="mobile"
                        placeholder="Mobile"
                    >

                    <input
                        id="email"
                        type="email"
                        placeholder="Email"
                    >

                    <select id="customerRepresentative">
                        <option value="">
                            Select Representative
                        </option>
                    </select>

                </div>


                <div class="button-row">

                    <button
                        class="primary-btn"
                        onclick="saveCustomer()"
                    >
                        Save Customer
                    </button>

                    <button
                        class="secondary-btn"
                        onclick="clearCustomerForm()"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <div class="card">

                <input
                    id="customerSearch"
                    class="search-box"
                    placeholder="Search customer..."
                    oninput="searchCustomers()"
                >


                <table>

                    <thead>

                        <tr>
                            <th>Code</th>
                            <th>Shop</th>
                            <th>Address</th>
                            <th>Owner</th>
                            <th>Mobile</th>
                            <th>Email</th>
                            <th>Representative</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody
                        id="customersTableBody"
                    ></tbody>

                </table>

            </div>

        </section>



        <!-- =================================================
             PRODUCTS
        ================================================== -->

        <section
            id="products-page"
            class="page"
        >

            <div class="card">

                <h2>Products</h2>


                <div class="form-grid">

                    <input
                        id="productCode"
                        type="text"
                        placeholder="Product Code"
                    >

                    <input
                        id="productName"
                        type="text"
                        placeholder="Product Name"
                    >

                    <input
                        id="packSize"
                        type="text"
                        placeholder="Pack Size"
                    >

                    <input
                        id="unitTP"
                        type="number"
                        step="0.01"
                        placeholder="Unit TP"
                    >

                    <input
                        id="unitVAT"
                        type="number"
                        step="0.01"
                        placeholder="Unit VAT"
                    >

                    <input
                        id="unitRPVAT"
                        type="number"
                        step="0.01"
                        placeholder="Unit RP + VAT"
                    >

                </div>


                <div class="button-row">

                    <button
                        id="productSaveButton"
                        class="primary-btn"
                        onclick="saveProduct()"
                    >
                        Add Product
                    </button>


                    <button
                        class="secondary-btn"
                        onclick="clearProductForm()"
                    >
                        Clear
                    </button>

                </div>

            </div>


            <div class="card">

                <input
                    id="productSearch"
                    class="search-box"
                    type="text"
                    placeholder="Search product..."
                    oninput="searchProducts()"
                >


                <table>

                    <thead>

                        <tr>
                            <th>Code</th>
                            <th>Product</th>
                            <th>Pack</th>
                            <th>TP</th>
                            <th>VAT</th>
                            <th>RP + VAT</th>
                            <th>Actions</th>
                        </tr>

                    </thead>


                    <tbody
                        id="productsTableBody"
                    ></tbody>

                </table>

            </div>

        </section>


    </main>

</div>



<script>

    /*
     * ======================================================
     * SUPABASE
     * ======================================================
     *
     * KEEP YOUR EXISTING SUPABASE URL AND KEY HERE.
     *
     * If you already have these two values in your old
     * index.html, use those same values.
     */

    const SUPABASE_URL =
        "https://bzfnsoqefgddkjjoleuz.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_kR3TRDVXjwQaj0xatKYHCA_mxDy26T_";


    const client =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    let currentUser = null;


    // ======================================================
    // LOGIN
    // ======================================================

    async function loginUser() {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        const message =
            document.getElementById("loginMessage");


        if (!email || !password) {

            message.textContent =
                "Enter email and password.";

            return;
        }


        const { data, error } =
            await client.auth.signInWithPassword({
                email,
                password
            });


        if (error) {

            message.textContent =
                error.message;

            return;
        }


        currentUser = data.user;

        showApplication();

    }



    // ======================================================
    // LOGOUT
    // ======================================================

    async function logoutUser() {

        await client.auth.signOut();

        currentUser = null;

        document.getElementById("appScreen").style.display =
            "none";

        document.getElementById("loginScreen").style.display =
            "flex";
    }



    // ======================================================
    // SHOW APP
    // ======================================================

    function showApplication() {

        document.getElementById("loginScreen").style.display =
            "none";

        document.getElementById("appScreen").style.display =
            "block";


        showPage("representatives");

    }



    // ======================================================
    // PAGE NAVIGATION
    // ======================================================

    function showPage(page) {

        const pages = [
            "representatives-page",
            "customers-page",
            "products-page"
        ];


        pages.forEach(id => {

            const element =
                document.getElementById(id);

            if (element) {
                element.classList.remove("active");
            }

        });


        if (page === "representatives") {

            document
                .getElementById("representatives-page")
                .classList.add("active");

            if (typeof loadRepresentatives === "function") {
                loadRepresentatives();
            }

        }


        if (page === "customers") {

            document
                .getElementById("customers-page")
                .classList.add("active");

            if (typeof loadRepresentatives === "function") {
                loadRepresentatives();
            }

            if (typeof loadCustomers === "function") {
                loadCustomers();
            }

        }


        if (page === "products") {

            document
                .getElementById("products-page")
                .classList.add("active");

            if (typeof loadProducts === "function") {
                loadProducts();
            }

        }

    }


    // ======================================================
    // ESCAPE HTML
    // ======================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ======================================================
    // CHECK LOGIN SESSION
    // ======================================================

    async function checkSession() {

        const { data } =
            await client.auth.getSession();


        if (data.session) {

            currentUser =
                data.session.user;

            showApplication();

        } else {

            document.getElementById(
                "loginScreen"
            ).style.display = "flex";

        }

    }


    checkSession();

</script>

</body>
</html>
