<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIMS - Kemiko Invoice Management System</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        #login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 360px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.12);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .login-box p {
            text-align: center;
            color: #666;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            background: #1667d9;
            color: white;
            font-size: 16px;
        }

        button:hover {
            opacity: .9;
        }

        #app-page {
            display: none;
        }

        header {
            background: white;
            padding: 18px 25px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            width: auto;
            background: #d9534f;
            padding: 8px 18px;
        }

        .dashboard {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .card h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="login-page">

    <div class="login-box">

        <h1>KIMS</h1>

        <p>Kemiko Invoice Management System</p>

        <input
            type="email"
            id="email"
            placeholder="Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="handleLogin()">
            Login
        </button>

        <p id="login-error"></p>

    </div>

</div>


<!-- APPLICATION -->
<div id="app-page">

    <header>

        <h2>KIMS</h2>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <div class="dashboard">

        <h1>Dashboard</h1>

        <p>
            Welcome to Kemiko Invoice Management System.
        </p>

        <div class="cards">

            <div class="card">
                <h3>Representatives</h3>
                <p>Manage representatives</p>
            </div>

            <div class="card">
                <h3>Customers</h3>
                <p>Manage customers</p>
            </div>

            <div class="card">
                <h3>Products</h3>
                <p>Manage products</p>
            </div>

            <div class="card">
                <h3>Invoices</h3>
                <p>Create and manage invoices</p>
            </div>

        </div>

    </div>

</div>


<script src="app.js"></script>

<script>

async function handleLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("login-error");

    error.textContent = "";

    if (!email || !password) {

        error.textContent =
            "Please enter email and password.";

        return;
    }

    const success =
        await login(email, password);

    if (!success) {

        error.textContent =
            "Login failed.";

    }
}

</script>

</body>
</html>
