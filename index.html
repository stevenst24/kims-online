<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        KIMS - Kemiko Invoice Management System
    </title>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f6f8;

            color: #222;
        }


        /* =================================================
           LOGIN
           ================================================= */

        #login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .login-box {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,.12);
        }


        .login-box h1 {

            text-align: center;

            margin: 0;

            font-size: 32px;
        }


        .login-box .subtitle {

            text-align: center;

            color: #666;

            margin:
                8px 0 25px;
        }


        /* =================================================
           GENERAL INPUT
           ================================================= */

        input {

            width: 100%;

            padding: 12px 14px;

            margin-top: 7px;

            margin-bottom: 15px;

            border:
                1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }


        input:focus {

            outline: none;

            border-color: #1667d9;

            box-shadow:
                0 0 0 2px
                rgba(22,103,217,.1);
        }


        button {

            border: none;

            border-radius: 7px;

            padding:
                10px 16px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;
        }


        .primary-btn {

            background: #1667d9;

            color: white;

            width: 100%;

            padding: 13px;

            font-size: 16px;
        }


        .primary-btn:hover {

            background: #0f56bb;
        }


        /* =================================================
           APP
           ================================================= */

        #app-page {

            display: none;

            min-height: 100vh;
        }


        header {

            background: white;

            border-bottom:
                1px solid #ddd;

            padding:
                16px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        header h2 {

            margin: 0;

            color: #1667d9;
        }


        .logout-btn {

            background: #d9534f;

            color: white;
        }


        .container {

            max-width: 1200px;

            margin: auto;

            padding: 25px;
        }


        /* =================================================
           PAGE TITLE
           ================================================= */

        .page-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .page-header h1 {

            margin: 0;

            font-size: 28px;
        }


        /* =================================================
           FORM CARD
           ================================================= */

        .card {

            background: white;

            border-radius: 10px;

            padding: 22px;

            margin-bottom: 25px;

            box-shadow:
                0 2px 10px
                rgba(0,0,0,.07);
        }


        .card h2 {

            margin-top: 0;

            margin-bottom: 20px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap:
                0 20px;
        }


        .form-group label {

            font-weight: 600;

            font-size: 14px;
        }


        .form-actions {

            margin-top: 5px;

            display: flex;

            gap: 10px;
        }


        #save-representative-btn {

            background: #1667d9;

            color: white;
        }


        #cancel-edit-btn {

            background: #777;

            color: white;

            display: none;
        }


        /* =================================================
           SEARCH
           ================================================= */

        .search-box {

            margin-bottom: 18px;
        }


        .search-box input {

            margin: 0;

            max-width: 450px;
        }


        /* =================================================
           TABLE
           ================================================= */

        .table-wrapper {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;

            min-width: 750px;
        }


        th {

            background: #f0f2f5;

            text-align: left;

            padding: 13px;

            border-bottom:
                1px solid #ddd;

            font-size: 14px;
        }


        td {

            padding: 13px;

            border-bottom:
                1px solid #eee;

            font-size: 14px;
        }


        tr:hover td {

            background: #fafafa;
        }


        .actions {

            white-space: nowrap;
        }


        .edit-btn {

            background: #f0ad4e;

            color: white;

            margin-right: 5px;
        }


        .delete-btn {

            background: #d9534f;

            color: white;
        }


        .empty {

            text-align: center;

            color: #777;

            padding: 30px;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 700px) {

            header {

                padding: 14px 16px;
            }


            .container {

                padding: 15px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .page-header {

                align-items: flex-start;

                flex-direction: column;

                gap: 8px;
            }


            .card {

                padding: 16px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     LOGIN
     ===================================================== -->

<div id="login-page">

    <div class="login-box">

        <h1>KIMS</h1>

        <p class="subtitle">
            Kemiko Invoice Management System
        </p>


        <input
            type="email"
            id="email"
            placeholder="Email"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
        >


        <button
            class="primary-btn"
            onclick="handleLogin()"
        >
            Login
        </button>


        <p id="login-error"></p>

    </div>

</div>


<!-- =====================================================
     APPLICATION
     ===================================================== -->

<div id="app-page">


    <header>

        <h2>KIMS</h2>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <main class="container">


        <div class="page-header">

            <h1>
                Representatives
            </h1>

        </div>


        <!-- =================================================
             REPRESENTATIVE FORM
             ================================================= -->

        <div class="card">

            <h2>
                Add / Edit Representative
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Representative Code *
                    </label>

                    <input
                        type="text"
                        id="rep-code"
                        placeholder="Example: SYL-117"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Representative Name *
                    </label>

                    <input
                        type="text"
                        id="rep-name"
                        placeholder="Example: Abdul Bari"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Territory Code
                    </label>

                    <input
                        type="text"
                        id="territory-code"
                        placeholder="Example: SYL"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Territory Name
                    </label>

                    <input
                        type="text"
                        id="territory-name"
                        placeholder="Example: Sylhet"
                    >

                </div>


            </div>


            <div class="form-actions">

                <button
                    id="save-representative-btn"
                    onclick="saveRepresentative()"
                >
                    Create Representative
                </button>


                <button
                    id="cancel-edit-btn"
                    onclick="clearRepresentativeForm()"
                >
                    Cancel
                </button>

            </div>

        </div>


        <!-- =================================================
             REPRESENTATIVE LIST
             ================================================= -->

        <div class="card">

            <h2>
                Representative List
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="representative-search"
                    placeholder="Search code, name or territory..."
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Representative Code
                            </th>

                            <th>
                                Representative Name
                            </th>

                            <th>
                                Territory Code
                            </th>

                            <th>
                                Territory Name
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="representatives-table-body"
                    >

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>


<script src="app.js"></script>


<script>

async function handleLogin() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const error =
        document
            .getElementById("login-error");


    error.textContent = "";


    if (!email || !password) {

        error.textContent =
            "Please enter email and password.";

        return;
    }


    const success =
        await login(
            email,
            password
        );


    if (!success) {

        error.textContent =
            "Login failed.";

    }

}

</script>


</body>

</html>
